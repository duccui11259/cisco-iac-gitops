---
# =====================================================================
# THÔNG TIN XÁC THỰC VÀ THAM SỐ DỊCH VỤ TOÀN HỆ THỐNG
# =====================================================================

# Phương thức kết nối SSH CLI mạng
ansible_connection: ansible.netcommon.network_cli

# Tài khoản SSH và Enable Secret
ansible_user: admin
ansible_password: admin123
ansible_become: yes
ansible_become_method: enable
ansible_become_password: admin123

# Cấu hình dịch vụ hệ thống mạng tập trung
system_services:
  domain_name: "lab.local"
  ntp_server: "192.168.10.100"
  syslog_server: "192.168.10.200"
  dns_servers:
    - "8.8.8.8"
    - "1.1.1.1"
