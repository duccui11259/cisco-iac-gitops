---
# =====================================================================
# THÔNG TIN XÁC THỰC VÀ PHƯƠNG THỨC KẾT NỐI CHUNG CHO THIẾT BỊ MẠNG
# =====================================================================

# Phương thức kết nối chuẩn chuyên dụng cho Network Automation
ansible_connection: ansible.netcommon.network_cli

# Tài khoản SSH đăng nhập vào thiết bị Cisco (hãy đổi theo cấu hình Lab của bạn)
ansible_user: admin
ansible_password: CiscoSSHPassword123!

# Cấu hình tự động chuyển sang chế độ Privilege Exec Mode (enable mode)
ansible_become: yes
ansible_become_method: enable
ansible_become_password: CiscoEnableSecret123!
