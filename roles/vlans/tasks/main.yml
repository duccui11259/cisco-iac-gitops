---
# =====================================================================
# ROLE: VLANS - QUẢN LÝ PHÂN ĐOẠN MẠNG TRÊN CISCO SWITCH
# =====================================================================

- name: "Dong bo cau hinh Vlan Switching tren Switch qua SVI"
  cisco.ios.ios_config:
    lines:
      - "description {{ item.name }}"
      - "no shutdown"
    parents: "interface Vlan{{ item.vlan_id }}"
  loop: "{{ vlans_list | default([]) }}"
  when: vlans_list is defined
