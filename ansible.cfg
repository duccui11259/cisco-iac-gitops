[defaults]
# Chỉ định file inventory mặc định
inventory = hosts.ini

# Tắt cảnh báo SSH Host Key checking khi kết nối lần đầu tới router/switch lab
host_key_checking = False

# Không tạo file .retry khi thực thi playbook thất bại
retry_files_enabled = False

# Thời gian chờ phản hồi từ thiết bị (tính bằng giây)
timeout = 30

# Định dạng hiển thị kết quả trực quan trên console
stdout_callback = yaml

[persistent_connection]
# Thời gian duy trì socket SSH kết nối tới thiết bị mạng
connect_timeout = 60

# Thời gian chờ tối đa khi chạy một câu lệnh CLI trên thiết bị
command_timeout = 60
