---
# =====================================================================
# CẤU HÌNH CHI TIẾT RIÊNG CHO SWITCH-ACCESS
# =====================================================================

l2_interfaces:
  - name: FastEthernet1/1
    mode: access
    access:
      vlan: 10
    description: "KET NOI MAY IN & PC PHONG KE TOAN"

  - name: FastEthernet1/2
    mode: access
    access:
      vlan: 20
    description: "KET NOI MAY TRAM PHONG KY THUAT"

  - name: FastEthernet1/3
    mode: access
    access:
      vlan: 50
    description: "KET NOI MAY TRAM PHONG MARKETING"

  - name: FastEthernet1/15
    mode: trunk
    trunk:
      allowed_vlans: "1-1005"
    description: "UPLINK TRUNK KET NOI LEN ROUTER"

svi_interfaces:
  - name: Vlan1
    description: "IP QUAN TRI SVI ACCESS SWITCH"
    ipv4:
      - address: 192.168.99.10
        netmask: 255.255.255.0
    enabled: true

default_gateway: 192.168.99.1
