---
# =====================================================================
# CẤU HÌNH CHI TIẾT RIÊNG CHO ROUTER-EDGE (BIÊN INTERNET)
# =====================================================================

l3_interfaces:
  - name: GigabitEthernet0/0
    description: "CONG WAN KET NOI NHA MANG ISP"
    ipv4:
      - address: 203.0.113.2
        netmask: 255.255.255.252
    enabled: true

  - name: GigabitEthernet0/1
    description: "DUONG TRUYEN NOI BO KET NOI ROUTER-CORE"
    ipv4:
      - address: 10.0.0.1
        netmask: 255.255.255.252
    enabled: true

  - name: Loopback0
    description: "ROUTER-ID & MANAGEMENT INTERFACE"
    ipv4:
      - address: 10.255.255.1
        netmask: 255.255.255.255
    enabled: true

# Định tuyến tĩnh ra Internet Gateway
static_routes:
  - destination: 0.0.0.0
    netmask: 0.0.0.0
    next_hop: 203.0.113.1
