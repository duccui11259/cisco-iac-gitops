---
# =====================================================================
# CẤU HÌNH CHI TIẾT RIÊNG CHO ROUTER-CORE (TRUNG TÂM LAB)
# =====================================================================

l3_interfaces:
  - name: GigabitEthernet0/0
    description: "KET NOI ROUTER-EDGE WAN"
    ipv4:
      - address: 10.0.0.2
        netmask: 255.255.255.252
    enabled: true

  - name: GigabitEthernet0/1.10
    description: "GATEWAY CHO PHONG KE TOAN (VLAN 10)"
    ipv4:
      - address: 192.168.10.1
        netmask: 255.255.255.0
    encapsulation: 10
    enabled: true

  - name: GigabitEthernet0/1.20
    description: "GATEWAY CHO PHONG KY THUAT (VLAN 20)"
    ipv4:
      - address: 192.168.20.1
        netmask: 255.255.255.0
    encapsulation: 20
    enabled: true

  - name: Loopback0
    description: "ROUTER-ID INTERFACE"
    ipv4:
      - address: 10.255.255.2
        netmask: 255.255.255.255
    enabled: true
