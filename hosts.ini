# =====================================================================
# DANH SÁCH THIẾT BỊ MẠNG TRONG PHÒNG LAB
# =====================================================================

# Nhóm thiết bị Router định tuyến
[routers]
router-edge   ansible_host=192.168.10.1
router-core   ansible_host=192.168.10.2

# Nhóm thiết bị Switch mạng nội bộ
[switches]
switch-access ansible_host=192.168.10.3

# Nhóm tổng hợp tất cả thiết bị mạng Cisco IOS
[cisco:children]
routers
switches

# Biến áp dụng chung cho tất cả các thiết bị Cisco IOS
[cisco:vars]
ansible_network_os=cisco.ios
