# =====================================================================
# DANH SÁCH THIẾT BỊ MẠNG TRONG PHÒNG LAB (INVENTORY)
# =====================================================================

# Nhóm thiết bị Router định tuyến
[routers]
router-edge   ansible_host=172.30.32.1 ansible_port=2221
router-core   ansible_host=172.30.32.1 ansible_port=2223

# Nhóm thiết bị Switch mạng nội bộ
[switches]
switch-access ansible_host=172.30.32.1 ansible_port=2222

# Nhóm tổng hợp tất cả thiết bị mạng Cisco IOS
[cisco:children]
routers
switches

# Biến áp dụng chung cho tất cả các thiết bị Cisco IOS
[cisco:vars]
ansible_network_os=cisco.ios.ios
ansible_connection=network_cli
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
